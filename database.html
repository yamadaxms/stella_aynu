<!doctype html>
<html lang="ja" class="star-culture-list-root">
  <head>
    <meta charset="UTF-8" />
    <title>アイヌ民族星文化ビューア ～カムイの星図～</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css?v=v070g" />
    <link rel="stylesheet" href="css/starCulture.css?v=v070g" />
  </head>
  <body class="star-culture-list-body" data-star-culture-detail-mode="manual">
    <div id="site-header-include"></div>

    <main class="star-culture-page">
      <header class="star-culture-page-header">
        <div>
          <h2>星文化データベース</h2>
        </div>
        <a class="star-culture-back-link" href="index.html">星図ビューへ戻る</a>
      </header>

      <section class="star-culture-panel" aria-labelledby="star-culture-search-heading">
        <h3 id="star-culture-search-heading">検索条件</h3>
        <div class="star-culture-search-grid">
          <div class="star-culture-field">
            <label for="star-culture-query">名称・名称（英字）・意味・関連天体（名称・所属星座・メモ）</label>
            <input id="star-culture-query" type="search" autocomplete="off" />
          </div>
          <fieldset class="star-culture-region-filter">
            <legend>伝承地域</legend>
            <div class="star-culture-region-mode" role="group" aria-label="伝承地域の指定方法">
              <span>指定方法</span>
              <label><input type="radio" name="star-culture-region-mode" value="or" checked />OR（いずれか）</label>
              <label><input type="radio" name="star-culture-region-mode" value="and" />AND（すべて）</label>
            </div>
            <label><input type="checkbox" name="star-culture-region" value="aynu1" />地域区分Ⅰ</label>
            <label><input type="checkbox" name="star-culture-region" value="aynu2" />地域区分Ⅱ</label>
            <label><input type="checkbox" name="star-culture-region" value="aynu3" />地域区分Ⅲ</label>
            <label><input type="checkbox" name="star-culture-region" value="aynu4" />地域区分Ⅳ</label>
            <label><input type="checkbox" name="star-culture-region" value="aynu5" />地域区分Ⅴ</label>
            <label><input type="checkbox" name="star-culture-region" value="other" />その他</label>
          </fieldset>
          <div class="star-culture-actions">
            <button id="star-culture-reset" type="button">クリア</button>
          </div>
        </div>
      </section>

      <section class="star-culture-panel" aria-labelledby="star-culture-results-heading">
        <div class="star-culture-section-header">
          <h3 id="star-culture-results-heading">検索結果</h3>
          <p id="star-culture-result-count" class="star-culture-result-count" aria-live="polite">0件</p>
        </div>

        <div id="star-culture-loading" class="star-culture-loading" aria-live="polite" hidden>データを読み込んでいます。</div>
        <div id="star-culture-status" class="star-culture-status" role="alert" aria-live="assertive" hidden></div>
        <div id="star-culture-empty" class="star-culture-empty" hidden>該当する星文化情報はありません。</div>

        <div id="star-culture-table-wrap" class="star-culture-table-wrap" hidden>
          <table class="star-culture-table">
            <thead>
              <tr>
                <th scope="col" data-sort-column="detail" aria-sort="none"><button class="star-culture-sort-button" type="button">詳細</button></th>
                <th scope="col" data-sort-column="name" aria-sort="ascending"><button class="star-culture-sort-button" type="button">名称</button></th>
                <th scope="col" data-sort-column="nameEn" aria-sort="none"><button class="star-culture-sort-button" type="button">名称（英字）</button></th>
                <th scope="col" data-sort-column="description" aria-sort="none"><button class="star-culture-sort-button" type="button">意味</button></th>
                <th scope="col" data-sort-column="astro" aria-sort="none"><button class="star-culture-sort-button" type="button">関連天体</button></th>
                <th scope="col" data-sort-column="aynu1" aria-sort="none"><button class="star-culture-sort-button" type="button">地域区分Ⅰ</button></th>
                <th scope="col" data-sort-column="aynu2" aria-sort="none"><button class="star-culture-sort-button" type="button">地域区分Ⅱ</button></th>
                <th scope="col" data-sort-column="aynu3" aria-sort="none"><button class="star-culture-sort-button" type="button">地域区分Ⅲ</button></th>
                <th scope="col" data-sort-column="aynu4" aria-sort="none"><button class="star-culture-sort-button" type="button">地域区分Ⅳ</button></th>
                <th scope="col" data-sort-column="aynu5" aria-sort="none"><button class="star-culture-sort-button" type="button">地域区分Ⅴ</button></th>
                <th scope="col" data-sort-column="other" aria-sort="none"><button class="star-culture-sort-button" type="button">その他</button></th>
                <th scope="col" data-sort-column="chart" aria-sort="none"><button class="star-culture-sort-button" type="button">星図表示</button></th>
              </tr>
            </thead>
            <tbody id="star-culture-results"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="star-culture-detail-modal" class="star-culture-modal" hidden>
      <div class="star-culture-modal-backdrop" data-star-culture-modal-close></div>
      <div class="star-culture-modal-frame">
        <section class="star-culture-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="star-culture-modal-title">
          <header class="star-culture-modal-header">
            <h2 id="star-culture-modal-title">星文化詳細</h2>
            <button class="star-culture-modal-close" type="button" aria-label="閉じる" data-star-culture-modal-close>×</button>
          </header>

          <div id="star-culture-modal-status" class="star-culture-status" role="alert" aria-live="assertive" hidden></div>

          <article id="star-culture-detail" class="star-culture-detail" hidden>
            <section class="star-culture-panel" aria-labelledby="star-culture-basic-heading">
              <div class="star-culture-section-header">
                <h3 id="star-culture-basic-heading">基本情報</h3>
              </div>
              <div class="star-culture-table-wrap">
                <table class="star-culture-detail-table">
                  <tbody id="star-culture-basic"></tbody>
                </table>
              </div>
            </section>

            <section class="star-culture-panel" aria-labelledby="star-culture-related-heading">
              <div class="star-culture-section-header">
                <h3 id="star-culture-related-heading">関連情報</h3>
              </div>

              <div class="star-culture-tabs" role="tablist" aria-label="星文化関連情報">
                <button id="star-culture-tab-astro" class="star-culture-tab" type="button" role="tab" aria-selected="true" aria-controls="star-culture-panel-astro">関連天体</button>
                <button id="star-culture-tab-source" class="star-culture-tab" type="button" role="tab" aria-selected="false" aria-controls="star-culture-panel-source" tabindex="-1">出典</button>
                <button id="star-culture-tab-tradition" class="star-culture-tab" type="button" role="tab" aria-selected="false" aria-controls="star-culture-panel-tradition" tabindex="-1">伝承</button>
                <button id="star-culture-tab-area" class="star-culture-tab" type="button" role="tab" aria-selected="false" aria-controls="star-culture-panel-area" tabindex="-1">伝承地域</button>
                <button id="star-culture-tab-word" class="star-culture-tab" type="button" role="tab" aria-selected="false" aria-controls="star-culture-panel-word" tabindex="-1">名称詳細</button>
              </div>

              <div id="star-culture-panel-astro" class="star-culture-tab-panel" role="tabpanel" aria-labelledby="star-culture-tab-astro">
                <div id="star-culture-astro"></div>
              </div>
              <div id="star-culture-panel-source" class="star-culture-tab-panel" role="tabpanel" aria-labelledby="star-culture-tab-source" hidden>
                <div id="star-culture-source"></div>
              </div>
              <div id="star-culture-panel-tradition" class="star-culture-tab-panel" role="tabpanel" aria-labelledby="star-culture-tab-tradition" hidden>
                <div id="star-culture-tradition"></div>
              </div>
              <div id="star-culture-panel-area" class="star-culture-tab-panel" role="tabpanel" aria-labelledby="star-culture-tab-area" hidden>
                <div id="star-culture-area"></div>
              </div>
              <div id="star-culture-panel-word" class="star-culture-tab-panel" role="tabpanel" aria-labelledby="star-culture-tab-word" hidden>
                <div id="star-culture-word"></div>
              </div>
            </section>
          </article>
        </section>
        <span class="modal-resize-handle" role="separator" aria-orientation="vertical" aria-label="星文化詳細の横幅" aria-valuemin="320" aria-valuemax="1120" aria-valuenow="1120" tabindex="0" title="ドラッグまたは左右キーで横幅を変更"></span>
      </div>
    </div>

    <script src="js/resizable.js?v=v070g"></script>
    <script src="js/config.js?v=v070g"></script>
    <script src="js/dataLoader.js?v=v070g"></script>
    <script src="js/starCultureDetail.js?v=v070g"></script>
    <script src="js/starCultureList.js?v=v070g"></script>
    <script src="js/includes.js?v=v070g"></script>
    <script src="js/contentProtection.js?v=v070g"></script>
  </body>
</html>
